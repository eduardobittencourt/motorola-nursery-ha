name: Feature request
description: Suggest a compatible, safe improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Explain the user problem rather than only a proposed command.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Relevant camera model
      description: Do not include serial numbers or identifiers.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Safety and scope
      options:
        - label: This request does not require publishing credentials, firmware, APKs, proprietary libraries, or personal captures.
          required: true
