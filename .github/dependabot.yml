version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # pytest-homeassistant-custom-component pins these exactly; Dependabot must
    # update them only as part of that package's own compatible release.
    ignore:
      - dependency-name: coverage
      - dependency-name: pytest
    groups:
      test-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
