version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # Keep the compatibility baseline fixed until minimum HA support changes.
    exclude-paths:
      - requirements-test-minimum.txt
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
