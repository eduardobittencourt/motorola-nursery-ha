name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  tests:
    name: Tests (${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ha: [minimum, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install current HA test environment
        if: matrix.ha == 'current'
        run: python -m pip install -r requirements-test.txt
      - name: Install minimum supported HA (2026.9.3)
        if: matrix.ha == 'minimum'
        # This plugin pins HA 2026.9.3 and its compatible test dependencies.
        run: >-
          python -m pip install -r requirements-test-tools.txt
          pytest-homeassistant-custom-component==0.13.366
      - run: python -m pip check
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: bandit -q -r custom_components/motorola_nursery
      - run: coverage run --source=custom_components/motorola_nursery -m pytest -q
      - run: coverage report --fail-under=80
