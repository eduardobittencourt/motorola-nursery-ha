name: Package integration release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Attach HACS package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version and create integration-only ZIP
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 -I - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('custom_components/motorola_nursery/manifest.json').read_text())['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+_-]*', version)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Release tag and manifest version differ'
          PY
          git archive --format=zip HEAD:custom_components/motorola_nursery > "$RUNNER_TEMP/motorola_nursery.zip"
      - name: Attach package without replacing an existing asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/motorola_nursery.zip" --repo "$GITHUB_REPOSITORY"
