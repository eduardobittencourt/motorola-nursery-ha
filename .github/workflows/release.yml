name: Publish integration release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag (for example v0.8.1)
        type: string
        required: true
      prerelease:
        description: Publish as a beta/prerelease without changing latest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: integration-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Package before publishing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 -I - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          assert len(tag) <= 65 and re.fullmatch(r'v\d++\.\d++\.\d++[A-Za-z0-9.+_-]*+', tag, re.ASCII), 'Invalid release tag'
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: source
          persist-credentials: false
      - name: Verify manifest and create integration-only ZIP
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('custom_components/motorola_nursery/manifest.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Release tag and manifest version differ'
          PY
          git archive --format=zip HEAD:custom_components/motorola_nursery > "$RUNNER_TEMP/motorola_nursery.zip"
      - name: Create draft, attach package, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: bash trusted/scripts/publish_release.sh "$RUNNER_TEMP/motorola_nursery.zip"
